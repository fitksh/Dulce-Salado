name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dulce_salado_test
          POSTGRES_USER: dulce_salado
          POSTGRES_PASSWORD: local-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dulce_salado -d dulce_salado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-development-key
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: dulce_salado_test
      POSTGRES_USER: dulce_salado
      POSTGRES_PASSWORD: local-ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py check
      - name: Herramientas de lectura PDF para QA
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python manage.py test
      - run: python manage.py makemigrations --check --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - name: Instalar herramientas QA aisladas
        run: npm install --prefix .qa --no-save --no-package-lock playwright@1.64.0 @axe-core/playwright@4.13.0
      - name: Instalar Chromium de pruebas
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.qa/browsers
        run: node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: QA de navegador con base descartable
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.qa/browsers
        run: |
          python tests/browser_server.py > /tmp/dulce-salado-qa.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid"; wait "$qa_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ > /dev/null; then break; fi
            sleep 1
          done
          node --test tests/browser.spec.cjs
      - name: Capturas QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: .qa/screenshots
          if-no-files-found: ignore
