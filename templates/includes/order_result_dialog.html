<dialog id="order-result-dialog" class="order-result-dialog" aria-labelledby="order-result-title" aria-describedby="order-result-body">
  <h2 id="order-result-title" tabindex="-1">¡Tu pedido fue generado con éxito! 🎉</h2>
  <div id="order-result-body">
    <p>Tu pedido ha sido generado correctamente.</p>
    <p>Si WhatsApp no se abrió automáticamente, podés intentar enviarlo nuevamente.</p>
  </div>
  <div class="order-result-actions">
    <a class="button" id="whatsapp-ready" target="_blank" rel="noopener noreferrer">Reenviar pedido</a>
    <button type="button" class="secondary" id="order-result-close">Cerrar</button>
  </div>
</dialog>
