<dialog id="cart-drawer" class="cart-drawer" aria-labelledby="cart-drawer-title" data-frame-url="{% url 'cart' %}?panel=1">
  <div class="cart-drawer-heading">
    <button type="button" class="secondary cart-drawer-close" aria-label="Cerrar carrito y volver al catálogo" autofocus>
      <svg class="icon drawer-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg>
      <svg class="icon drawer-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m14 5-7 7 7 7M7 12h14"/></svg>
    </button>
    <h2 id="cart-drawer-title">Tu carrito</h2>
  </div>
  <div class="cart-drawer-body">
    <div class="cart-drawer-loading" role="alert" hidden><p>No se pudo cargar el carrito.</p><a href="{% url 'cart' %}" target="_blank" rel="noopener noreferrer">Abrir carrito en otra pestaña</a></div>
    <iframe title="Productos y total del carrito" src="about:blank" referrerpolicy="same-origin"></iframe>
  </div>
</dialog>
