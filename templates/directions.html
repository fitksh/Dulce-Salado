{% extends "base.html" %}
{% block title %}Cómo llegar{% endblock %}
{% block content %}
  <section class="intro"><h1>Cómo llegar</h1></section>
  <section class="business-card" aria-label="Ubicación del comercio">
    {% if business.location_url %}
      <h2>Dirección</h2>
      <address>{{ business.address }}</address>
      <a class="button" href="{{ business.location_url }}" rel="noreferrer">Abrir en Google Maps</a>
    {% else %}
      <p class="notice" role="status">La dirección del comercio todavía no está disponible.</p>
    {% endif %}
  </section>
  <div class="location-map">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3604.4548652322774!2d-62.985447699999995!3d-40.8327939!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95f69903d3bece3b%3A0xcf531a0c9b35d8a8!2sDulce%20y%20Salado%20-%20Todo%20suelto!5e1!3m2!1sen!2sar!4v1791677257344!5m2!1sen!2sar" title="Ubicación de Dulce y Salado en Google Maps" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
{% endblock %}
