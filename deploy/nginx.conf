worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 12m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Two entrances keep the LAN from claiming HTTPS with a forged header.
    map $server_port $trusted_proto {
        default http;
        8080 https;
    }
    map $host $lan_host_allowed {
        default 0;
        192.168.0.80 1;
        localhost 1;
        127.0.0.1 1;
    }

    server {
        listen 8000 default_server;
        server_name 192.168.0.80 localhost 127.0.0.1;
        if ($lan_host_allowed = 0) { return 400; }
        # Secure cookies intentionally require the public HTTPS origin.
        location /admin { return 302 https://dulceysalado.ar$request_uri; }
        include /etc/nginx/dulce-salado.routes.conf;
    }

    server {
        listen 8080 default_server;
        server_name dulceysalado.ar;
        # Existing dedicated cloudflared network, verified before deployment.
        # Only Nginx is added to it; the tunnel container is not modified.
        allow 172.23.0.0/16;
        deny all;
        if ($host != dulceysalado.ar) { return 400; }
        # Cloudflare overwrites this header with the visitor protocol.
        if ($http_x_forwarded_proto != https) {
            return 301 https://dulceysalado.ar$request_uri;
        }
        include /etc/nginx/dulce-salado.routes.conf;
    }
}
